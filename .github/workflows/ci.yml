name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  backend:
    name: Backend safety gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: hospital_management_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: mysql://root:ci-only-root-password@127.0.0.1:3306/hospital_management_ci
      CORS_ORIGINS: http://localhost:3001
      SWAGGER_ENABLED: 'false'
      JWT_ACCESS_SECRET: ci-only-staff-access-secret
      JWT_REFRESH_SECRET: ci-only-staff-refresh-secret
      JWT_PATIENT_ACCESS_SECRET: ci-only-patient-access-secret
      JWT_PATIENT_REFRESH_SECRET: ci-only-patient-refresh-secret
      JWT_DEVICE_ACCESS_SECRET: ci-only-device-access-secret
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - run: npm run prisma:migrate:deploy
      - run: npm run db:drift:check
      - run: npm run db:reconcile
      - name: Runtime health and request-id smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run start:prod > backend-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --dump-header live.headers \
              --output live.json \
              http://127.0.0.1:3000/health/live; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            --output ready.json \
            http://127.0.0.1:3000/health/ready
          grep --ignore-case --quiet '^x-request-id:' live.headers
          grep --quiet '"status":"ok"' live.json
          grep --quiet '"status":"ok"' ready.json
      - name: Production dependency audit inventory
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend safety gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: http://localhost:3000
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Production dependency audit inventory
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
